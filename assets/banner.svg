<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#1e2140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#8b95ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="200" r="230" fill="#5865f2" fill-opacity="0.10"/>
  <circle cx="1080" cy="200" r="150" fill="#5865f2" fill-opacity="0.10"/>

  <!-- packet split motif -->
  <g transform="translate(930 130)">
    <rect x="0" y="0" width="120" height="60" rx="12" fill="#5865f2"/>
    <text x="60" y="38" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="20" fill="#fff">disc</text>
    <rect x="150" y="80" width="140" height="60" rx="12" fill="#8b95ff"/>
    <text x="220" y="118" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="20" fill="#14161f">ord.com</text>
    <path d="M120 30 C 140 30, 140 110, 150 110" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <text x="80" y="170" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="2">EMYDPI</text>
  <rect x="84" y="192" width="180" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="250" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="34" font-weight="600" fill="#e6e8ff">Türkiye'de Discord'a tek tıkla erişim</text>
  <text x="80" y="292" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="22" fill="#9aa0c8">Sadece Discord trafiği · Diğer sitelere ve DNS ayarlarına dokunmaz</text>

  <g font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="80" y="320" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#5865f2" stroke-opacity="0.6"/>
    <text x="165" y="346" text-anchor="middle" fill="#e6e8ff">Harici exe yok</text>
    <rect x="266" y="320" width="130" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#5865f2" stroke-opacity="0.6"/>
    <text x="331" y="346" text-anchor="middle" fill="#e6e8ff">VPN değil</text>
    <rect x="412" y="320" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#5865f2" stroke-opacity="0.6"/>
    <text x="487" y="346" text-anchor="middle" fill="#e6e8ff">Açık kaynak</text>
    <rect x="578" y="320" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#5865f2" stroke-opacity="0.6"/>
    <text x="673" y="346" text-anchor="middle" fill="#e6e8ff">Tek tıkla kurulum</text>
  </g>
</svg>
